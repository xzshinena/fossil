apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: fossil-streaming
  annotations:
    # No inbound HTTP traffic; this service subscribes to Pub/Sub push
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      serviceAccountName: fossil-streaming@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/fossil-streaming:latest
          env:
            - name: PUBSUB_PROJECT_ID
              value: PROJECT_ID
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
